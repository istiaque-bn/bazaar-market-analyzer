name: bazaar

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bazaar}
      POSTGRES_USER: ${POSTGRES_USER:-bazaar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bazaar} -d ${POSTGRES_DB:-bazaar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    environment: &django_env
      SERVICE_ROLE: web
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-sma.is}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://sma.is}
      TIME_ZONE: Asia/Dhaka
      SECURE_SSL_REDIRECT: "True" # cloudflared sets X-Forwarded-Proto: https; direct http://localhost:8000 will 301, use the tunnel/domain or curl -L
      CORS_ALLOWED_ORIGINS: ""
      POSTGRES_DB: ${POSTGRES_DB:-bazaar}
      POSTGRES_USER: ${POSTGRES_USER:-bazaar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable # traffic never leaves the docker-compose network
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_BROKER_ALLOW_PLAINTEXT: "True" # never leaves the docker-compose network
      DJANGO_LOG_LEVEL: INFO
      AUTO_ML_TRAINING: ${AUTO_ML_TRAINING:-True}
      AUTO_ML_TRAINING_TIME: ${AUTO_ML_TRAINING_TIME:-00:30}
      # Telegram ML daily report — see README.md's "Telegram ML daily
      # report" section. Effectively inert (generates/previews fine,
      # never sends) until both TELEGRAM_BOT_TOKEN and
      # TELEGRAM_ADMIN_CHAT_ID are set in .env.docker.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      TELEGRAM_ML_DAILY_REPORT: ${TELEGRAM_ML_DAILY_REPORT:-True}
      TELEGRAM_ML_REPORT_TIME: ${TELEGRAM_ML_REPORT_TIME:-17:00}
      TELEGRAM_ML_REPORT_TIMEZONE: ${TELEGRAM_ML_REPORT_TIMEZONE:-Asia/Dhaka}
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8001:8000" # local debugging only (8000 is taken by the native runserver dev instance); public access is via the sma.is tunnel below
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build: .
    restart: unless-stopped
    # -Q is required, not cosmetic: config/settings/base.py sets
    # CELERY_TASK_DEFAULT_QUEUE=market-fast, and a Celery worker only
    # ever consumes the queue(s) named here — a single worker MUST list
    # all four (see config/settings/base.py's CELERY_TASK_ROUTES) or
    # everything routed to market-analysis/market-heavy/notifications
    # (daily append, full analysis, ML training, digests, feedback
    # notifications) would silently never run. Concurrency/prefetch come
    # from CELERY_WORKER_CONCURRENCY / CELERY_WORKER_PREFETCH_MULTIPLIER
    # in the shared env below (Celery reads them from app.conf; no CLI
    # flag needed) — conservative defaults (1/1) for a small VM, see
    # README's "Worker recommendations".
    command:
      [
        "celery", "-A", "config", "worker", "--loglevel=info",
        "-Q", "market-fast,market-analysis,market-heavy,notifications,celery",
      ]
    environment:
      <<: *django_env
      SERVICE_ROLE: worker
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-1}
      CELERY_WORKER_PREFETCH_MULTIPLIER: ${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    restart: unless-stopped
    # --schedule points at a volume-backed path so beat's own "have I
    # already fired this tick" state survives a container restart —
    # combined with docker-compose only ever running one celery-beat
    # container for this service, this is what "exactly one Beat
    # instance, no duplicate scheduler on restart" means in practice
    # here (see README's "Deployment behavior" section for the fuller
    # explanation, incl. why django_celery_beat's DatabaseScheduler
    # isn't used).
    command:
      [
        "celery", "-A", "config", "beat", "--loglevel=info",
        "--schedule=/app/beat/celerybeat-schedule",
      ]
    environment:
      <<: *django_env
      SERVICE_ROLE: beat
    volumes:
      - beat_data:/app/beat
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Quick Tunnel: no Cloudflare login/domain needed, assigns a random
    # https://<words>.trycloudflare.com address on every start (check this
    # container's logs for the current URL). Swap to the commented-out
    # named-tunnel command below once a real domain is ready — that one
    # gives a stable hostname instead.
    command: ["tunnel", "--no-autoupdate", "--url", "http://web:8000"]
    # command: ["tunnel", "run"]
    # environment:
    #   TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN must be set in .env}
    depends_on:
      - web

volumes:
  postgres_data:
  beat_data:
