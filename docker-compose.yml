name: bazaar

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bazaar}
      POSTGRES_USER: ${POSTGRES_USER:-bazaar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bazaar} -d ${POSTGRES_DB:-bazaar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    environment: &django_env
      SERVICE_ROLE: web
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-sma.is}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://sma.is}
      TIME_ZONE: Asia/Dhaka
      SECURE_SSL_REDIRECT: "True" # cloudflared sets X-Forwarded-Proto: https; direct http://localhost:8000 will 301, use the tunnel/domain or curl -L
      CORS_ALLOWED_ORIGINS: ""
      POSTGRES_DB: ${POSTGRES_DB:-bazaar}
      POSTGRES_USER: ${POSTGRES_USER:-bazaar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable # traffic never leaves the docker-compose network
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_BROKER_ALLOW_PLAINTEXT: "True" # never leaves the docker-compose network
      DJANGO_LOG_LEVEL: INFO
      AUTO_ML_TRAINING: ${AUTO_ML_TRAINING:-True}
      AUTO_ML_TRAINING_TIME: ${AUTO_ML_TRAINING_TIME:-00:30}
      # DSE per-symbol history fetch concurrency (market/services/concurrent_fetch.py)
      # — benchmarked ~2x faster than sequential with zero completeness/error
      # regression at concurrency=5 against real dsebd.org (see the Aug 2026
      # concurrency plan). Falls back to "sequential" if unset.
      MARKET_FETCH_MODE: ${MARKET_FETCH_MODE:-threadpool}
      MARKET_FETCH_CONCURRENCY: ${MARKET_FETCH_CONCURRENCY:-5}
      # ML training thread cap (market/services/ml_model.py, close_learn.py)
      # — benchmarked on the production VPS's real 4 cores at limit_stocks=110:
      # n_jobs=4 trains fastest (9.1s) but has the worst concurrent-request
      # latency impact (p95 25.0ms); n_jobs=2 is nearly as latency-safe as
      # n_jobs=1 (23.1ms vs 23.0ms) while training 7% faster than n_jobs=1.
      ML_MAX_WORKERS: ${ML_MAX_WORKERS:-2}
      # Telegram ML daily report — see README.md's "Telegram ML daily
      # report" section. Effectively inert (generates/previews fine,
      # never sends) until both TELEGRAM_BOT_TOKEN and
      # TELEGRAM_ADMIN_CHAT_ID are set in .env.docker.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      # Dedicated bot for account-credential delivery — deliberately
      # separate from TELEGRAM_BOT_TOKEN above (see accounts/services.py).
      TELEGRAM_SECURITY_BOT_TOKEN: ${TELEGRAM_SECURITY_BOT_TOKEN:-}
      TELEGRAM_ML_DAILY_REPORT: ${TELEGRAM_ML_DAILY_REPORT:-True}
      TELEGRAM_ML_REPORT_TIME: ${TELEGRAM_ML_REPORT_TIME:-17:00}
      TELEGRAM_ML_REPORT_TIMEZONE: ${TELEGRAM_ML_REPORT_TIMEZONE:-Asia/Dhaka}
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8001:8000" # local debugging only (8000 is taken by the native runserver dev instance); public access is via the sma.is tunnel below
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Two worker processes instead of one, for real resource isolation
  # (see README's "Queues, locking, and concurrency" — this is the split
  # documented there as the option once market-fast queueing behind
  # market-heavy stops being negligible). Same four queues as before, no
  # new queue names: celery-worker-light takes the three cheap/fast ones
  # so a live-quote sync or digest never waits behind a full-analysis/ML
  # training run; celery-worker-heavy takes market-heavy alone, still at
  # concurrency 1 so it never runs two CPU-heavy jobs at once (that's
  # ML_MAX_WORKERS' job to bound per-job thread count, not this).
  celery-worker-light:
    build: .
    restart: unless-stopped
    command:
      [
        "celery", "-A", "config", "worker", "--loglevel=info", "--hostname=light@%h",
        "-Q", "market-fast,market-analysis,notifications,celery",
      ]
    environment:
      <<: *django_env
      SERVICE_ROLE: worker
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY_LIGHT:-2}
      CELERY_WORKER_PREFETCH_MULTIPLIER: ${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker-heavy:
    build: .
    restart: unless-stopped
    command:
      [
        "celery", "-A", "config", "worker", "--loglevel=info", "--hostname=heavy@%h",
        "-Q", "market-heavy",
      ]
    environment:
      <<: *django_env
      SERVICE_ROLE: worker
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY_HEAVY:-1}
      CELERY_WORKER_PREFETCH_MULTIPLIER: ${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    restart: unless-stopped
    # --schedule points at a volume-backed path so beat's own "have I
    # already fired this tick" state survives a container restart —
    # combined with docker-compose only ever running one celery-beat
    # container for this service, this is what "exactly one Beat
    # instance, no duplicate scheduler on restart" means in practice
    # here (see README's "Deployment behavior" section for the fuller
    # explanation, incl. why django_celery_beat's DatabaseScheduler
    # isn't used).
    command:
      [
        "celery", "-A", "config", "beat", "--loglevel=info",
        "--schedule=/app/beat/celerybeat-schedule",
      ]
    environment:
      <<: *django_env
      SERVICE_ROLE: beat
    volumes:
      - beat_data:/app/beat
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Production uses a named tunnel with a stable hostname configured in
    # Cloudflare Zero Trust. The token is supplied only at runtime and the
    # required-variable expression makes a missing token fail immediately.
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN must be set in the Compose environment file}
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  beat_data:
