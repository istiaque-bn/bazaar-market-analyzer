target-version = "py314"

[lint]
# Keep the first gate deliberately narrow: syntax/error checks and clear
# dead-code signals, without imposing a repository-wide formatting rewrite.
select = ["E4", "E7", "E9", "F401", "F841"]

[lint.per-file-ignores]
# Existing test fixtures intentionally retain a few values for readability;
# application code is fully covered by the rules above.
"**/tests/**" = ["F401", "F841"]
"**/tests.py" = ["F401", "F841"]
# Django must be configured before importing the user model in this script.
"scripts/authenticated_load_test.py" = ["E402"]
