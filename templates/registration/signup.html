{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<section class="panel" style="max-width:460px;margin:2rem auto;">
  <h2>Create account</h2>
  <form method="post" class="form">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Create account</button>
  </form>
</section>
{% endblock %}
